# GTNHGradle project properties.
# Based on ExampleMod1.7.10 template.

# Core build
minecraftVersion = 1.7.10
forgeVersion     = 10.13.4.1614
channel          = stable
mappingsVersion  = 12

modName        = ApotheosisGTNH
modId          = apogtnh
modGroup       = com.vonbraunz.apogtnh

# Java runtime; GTNH supports 17-25 via lwjgl3ify
enableModernJavaSyntax = jabel
enableGenericInjection = true

# Standard GTNH toggles
enableJavaSourceSetJava17 = false
generateGradleTokenClass  =

# Mixins for PlayerControllerMP reach extension
usesMixins     = true
mixinsPackage  = mixin

# Repos and downstream deps live in dependencies.gradle
includeWellKnownRepositories = true

# Disable publishing for personal build
usesMavenPublishing = false
